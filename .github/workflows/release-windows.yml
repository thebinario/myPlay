name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão sem prefixo v (ex.: 0.5.0-beta.1 ou 1.0.0)'
        required: true
        type: string
      channel:
        description: Canal da release
        required: true
        type: choice
        options: [beta, stable]

permissions:
  contents: read

concurrency:
  group: release-windows-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate version and reject an existing tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          node client/scripts/desktop-release.cjs --validate
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" > /dev/null
          status=$?
          set -e
          if [[ "$status" == 0 ]]; then
            echo "A tag v$RELEASE_VERSION já existe. Escolha uma nova versão."
            exit 1
          elif [[ "$status" != 2 ]]; then
            exit "$status"
          fi

  build:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ inputs.version }}
      channel: ${{ inputs.channel }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: midoteca-windows-x64-${{ inputs.version }}
          path: release
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          jq -e --arg version "$RELEASE_VERSION" --arg channel "$RELEASE_CHANNEL" \
            '.version == $version and .channel == $channel and .packagedSmoke == "passed" and .platform == "win32" and .arch == "x64"' release/build-info.json
          args=(--title "Midoteca v$RELEASE_VERSION" --target "$GITHUB_SHA" --generate-notes)
          if [[ "$RELEASE_CHANNEL" == beta ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release create "v$RELEASE_VERSION" release/*.exe release/SHA256SUMS release/build-info.json "${args[@]}"
