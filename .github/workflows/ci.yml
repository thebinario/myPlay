name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      channel:
        type: string
        default: beta

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || 'development' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  core:
    name: Backend (@midoteca/core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: midoteca
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: midoteca/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  desktop:
    name: Frontend (midoteca-desktop)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Prepare real core for desktop integration
        working-directory: midoteca
        run: |
          npm ci
          npm run build
      - name: Install
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  windows-package:
    name: Windows installer and packaged smoke
    needs: [core, desktop]
    uses: ./.github/workflows/package-windows.yml
    with:
      version: ${{ inputs.version || format('0.0.0-beta.{0}', github.run_number) }}
      channel: ${{ inputs.channel || 'beta' }}
